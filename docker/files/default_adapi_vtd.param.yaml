/**:
  ros__parameters:
    diagnostic_updater:
      period: 1.0
      use_fqn: true

/adapi/node/autoware_state:
  ros__parameters:
    update_rate: 10.0

/adapi/node/motion:
  ros__parameters:
    require_accept_start: false
    stop_check_duration: 1.0

/adapi/node/routing:
  ros__parameters:
    # The diagnostic graph checks freshness at 10 Hz. Keep this safely below
    # its one-second stale boundary to avoid availability flicker.
    diagnostic_updater:
      period: 0.2
      use_fqn: true
    stop_check_duration: 1.0

/adapi/node/localization:
  ros__parameters:
    # The diagnostic graph marks inputs stale after one second. Publishing at
    # the same one-second boundary caused a brief autonomous-mode dropout.
    diagnostic_updater:
      period: 0.2
      use_fqn: true

/adapi/node/mrm_request:
  ros__parameters:
    diagnostic_updater:
      period: 0.2
      use_fqn: true

/adapi/node/vehicle_metrics:
  ros__parameters:
    update_rate: 0.1
    max_energy_level: 1.0

/adapi/node/vehicle_door:
  ros__parameters:
    check_autoware_control: true

/adapi/node/manual/local:
  ros__parameters:
    mode: local
    diag_timeout_warn_duration: 1.0
    diag_timeout_error_duration: 2.0

/adapi/node/manual/remote:
  ros__parameters:
    mode: remote
    diag_timeout_warn_duration: 1.0
    diag_timeout_error_duration: 2.0

/adapi/node/fail_safe:
  ros__parameters:
    mrm_descriptions:
      emergency_stop:
        behavior: 2
        description: "Emergency stop"
      comfortable_stop:
        behavior: 3
        description: "Comfortable stop"
