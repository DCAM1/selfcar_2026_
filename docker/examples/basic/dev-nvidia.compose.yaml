# Generic upstream developer container.
# The reproducible VTD execution path is docker/vtd/compose.yaml.
services:
  autoware:
    image: ghcr.io/autowarefoundation/autoware@sha256:86d12e0f2504b058b54faead3a6113b5777c778899fc7a7c362e787808fdac24
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${AUTOWARE_MAP_DIR:?AUTOWARE_MAP_DIR must point to external Autoware maps}:/home/aw/autoware_data/maps
      - ${AUTOWARE_ML_MODELS_DIR:?AUTOWARE_ML_MODELS_DIR must point to external ML models}:/home/aw/autoware_data/ml_models
      - ${VTD_MAP_DIR:?VTD_MAP_DIR must point to external VTD maps}:/home/aw/vtd_autoware_maps:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
