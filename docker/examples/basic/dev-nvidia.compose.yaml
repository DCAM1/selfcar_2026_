services:
  autoware:
    image: ghcr.io/autowarefoundation/autoware:universe-devel-cuda-jazzy
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/autoware_data/maps:/home/aw/autoware_data/maps
      - ${HOME}/autoware_data/ml_models:/home/aw/autoware_data/ml_models
      - ${HOME}/vtd_autoware_maps:/home/aw/vtd_autoware_maps:ro
      - ${HOME}/autoware/docker/files/cyclonedds.xml:/home/aw/cyclonedds.xml:ro
      - ${HOME}/autoware_vtd_overlay/install/autoware_behavior_path_planner/lib/libautoware_behavior_path_planner_lib.so:/opt/autoware/autoware_behavior_path_planner/lib/libautoware_behavior_path_planner_lib.so:ro
      - ${HOME}/autoware_vtd_overlay/install/autoware_behavior_path_planner_common/lib/libautoware_behavior_path_planner_common.so:/opt/autoware/autoware_behavior_path_planner_common/lib/libautoware_behavior_path_planner_common.so:ro
      - ${HOME}/autoware_vtd_overlay/install/autoware_behavior_path_lane_change_module/lib/libautoware_behavior_path_lane_change_module.so:/opt/autoware/autoware_behavior_path_lane_change_module/lib/libautoware_behavior_path_lane_change_module.so:ro
      - ${HOME}/autoware_vtd_overlay/install/autoware_behavior_path_static_obstacle_avoidance_module/lib/libautoware_behavior_path_static_obstacle_avoidance_module.so:/opt/autoware/autoware_behavior_path_static_obstacle_avoidance_module/lib/libautoware_behavior_path_static_obstacle_avoidance_module.so:ro
      - ${HOME}/autoware_vtd_overlay/install/autoware_mission_planner_universe/lib/libautoware_mission_planner_universe_lanelet2_plugins.so:/opt/autoware/autoware_mission_planner_universe/lib/libautoware_mission_planner_universe_lanelet2_plugins.so:ro
      - ${HOME}/autoware/src/universe/autoware_universe/planning/behavior_velocity_planner/autoware_behavior_velocity_traffic_light_module/config/traffic_light.param.yaml:/opt/autoware/autoware_behavior_velocity_traffic_light_module/share/autoware_behavior_velocity_traffic_light_module/config/traffic_light.param.yaml:ro
      - ${HOME}/autoware/docker/files/default_adapi_vtd.param.yaml:/opt/autoware/autoware_default_adapi_universe/share/autoware_default_adapi_universe/config/default_adapi.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/rviz/autoware.rviz:/opt/autoware/autoware_launch/share/autoware_launch/rviz/autoware.rviz:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/planning/scenario_planning/common/common.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/planning/scenario_planning/common/common.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/planning/scenario_planning/common/autoware_velocity_smoother/velocity_smoother.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/planning/scenario_planning/common/autoware_velocity_smoother/velocity_smoother.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner/drivable_area_expansion.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner/drivable_area_expansion.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner/lane_change/lane_change.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner/lane_change/lane_change.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/control/autoware_autonomous_emergency_braking/autonomous_emergency_braking.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/control/autoware_autonomous_emergency_braking/autonomous_emergency_braking.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/control/trajectory_follower/longitudinal/pid.param.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/control/trajectory_follower/longitudinal/pid.param.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/system/diagnostics/control.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/system/diagnostics/control.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/system/diagnostics/localization.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/system/diagnostics/localization.yaml:ro
      - ${HOME}/autoware/src/launcher/autoware_launch/autoware_launch/config/system/diagnostics/system.yaml:/opt/autoware/autoware_launch/share/autoware_launch/config/system/diagnostics/system.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash
